services:
  postgres:
    image: postgres:16
    container_name: pppk-postgres
    environment:
      POSTGRES_USER: pppk
      POSTGRES_PASSWORD: pppk123
      POSTGRES_DB: medicinski_sustav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: pppk-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  minio:
    image: minio/minio
    container_name: pppk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  mongodata:
  miniodata: